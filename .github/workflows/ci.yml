name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Review / Tests / Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    strategy:
      matrix:
        version: [ 24 ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node continua necessário: semantic-release, multi-semantic-release,
      # `npm pkg set version` (prepareCmd) e o .npmrc de auth do registry.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
          registry-url: "https://npm.pkg.github.com/"

      - name: Setup Bun (version from packageManager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Playwright Install
        run: bun x playwright install chromium

      - if: ${{ github.event_name == 'pull_request' }}
        name: Review Dog Pull Request
        uses: reviewdog/action-eslint@v1
        with:
          reporter: github-pr-review
          github_token: ${{ secrets.GH_TOKEN }}
          eslint_flags: .
          fail_level: error

      - name: Build
        run: bun run build

      - name: Test CI
        run: bun run test:ci

      - if: ${{ github.event_name != 'pull_request' }}
        name: Multi Semantic Release
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
